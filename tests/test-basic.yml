name: Test basic usage (default latest version)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
      - name: Assert duckdb is installed and executable
        run: |
          echo "Checking duckdb is on PATH..."
          if ! command -v duckdb >/dev/null 2>&1; then
            echo "FAIL: duckdb not found on PATH"
            exit 1
          fi
          echo "duckdb found at: $(command -v duckdb)"
          echo "PASS"
      - name: Assert duckdb runs and returns a version
        run: |
          VERSION_OUTPUT=$(duckdb --version 2>&1 || true)
          echo "duckdb version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: duckdb --version returned empty output"
            exit 1
          fi
          echo "PASS"
      - name: Assert duckdb can execute a simple query
        run: |
          RESULT=$(duckdb -c "SELECT 42 AS answer;" 2>&1)
          echo "Query result: $RESULT"
          if echo "$RESULT" | grep -q "42"; then
            echo "PASS: duckdb executed query successfully"
          else
            echo "FAIL: expected '42' in output but got: $RESULT"
            exit 1
          fi
