name: Test invalid version rejected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Remove any pre-existing duckdb
        run: |
          sudo rm -f /usr/bin/duckdb 2>/dev/null || rm -f /usr/bin/duckdb 2>/dev/null || true
          rm -rf /opt/duckdb 2>/dev/null || sudo rm -rf /opt/duckdb 2>/dev/null || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.1.3; echo injected"
      - name: Assert action failed and nothing installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid version, got '$OUTCOME'"
            exit 1
          fi
          if [ -e /opt/duckdb/duckdb ]; then
            echo "FAIL: duckdb should not have been installed"
            exit 1
          fi
          echo "PASS"
