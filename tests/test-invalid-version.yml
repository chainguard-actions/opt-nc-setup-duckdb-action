name: Test invalid DuckDB version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          version: "1.1.3; echo pwned"
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid version"
            exit 1
          fi
          if [ -e /opt/duckdb/duckdb ]; then
            echo "FAIL: duckdb should not have been installed"
            exit 1
          fi
          echo "PASS"
