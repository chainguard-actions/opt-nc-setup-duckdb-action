name: Test install latest DuckDB
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert duckdb installed and working
        run: |
          set -e
          if ! command -v duckdb >/dev/null 2>&1; then
            echo "FAIL: duckdb not on PATH"
            exit 1
          fi
          if [ ! -x /opt/duckdb/duckdb ]; then
            echo "FAIL: /opt/duckdb/duckdb missing or not executable"
            exit 1
          fi
          VERSION="$(duckdb --version)"
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          RESULT="$(duckdb -noheader -csv -c 'SELECT 40 + 2;')"
          echo "query result: $RESULT"
          if [ "$(echo "$RESULT" | tr -d '[:space:]')" != "42" ]; then
            echo "FAIL: expected 42"
            exit 1
          fi
          echo "PASS"
