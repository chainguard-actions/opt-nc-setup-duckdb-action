name: Test install latest DuckDB
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure prerequisites (curl, unzip, sudo)
        run: |
          missing=""
          for t in curl unzip sudo; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
            $SUDO apt-get update -y && $SUDO apt-get install -y $missing
          fi
      - id: action
        uses: .
      - name: Assert duckdb is installed and runs
        run: |
          if ! command -v duckdb >/dev/null 2>&1; then
            echo "FAIL: duckdb not on PATH"
            exit 1
          fi
          VERSION="$(duckdb --version)"
          echo "duckdb --version: $VERSION"
          if ! echo "$VERSION" | grep -qE 'v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: unexpected version output"
            exit 1
          fi
          RESULT="$(duckdb -csv -noheader -c 'SELECT 40 + 2;')"
          echo "query result: $RESULT"
          if [ "$(echo "$RESULT" | tr -d '[:space:]')" != "42" ]; then
            echo "FAIL: expected 42"
            exit 1
          fi
          echo "PASS"
