name: Test specific version install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure prerequisites (wget, unzip, sudo)
        run: |
          missing=""
          for b in wget unzip sudo; do command -v "$b" >/dev/null 2>&1 || missing="$missing $b"; done
          if [ -n "$missing" ]; then
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
            $SUDO apt-get update -y && $SUDO apt-get install -y $missing
          fi
          sudo rm -f /usr/bin/duckdb || true
      - id: action
        uses: .
        with:
          version: v1.1.3
      - name: Assert pinned duckdb version installed
        run: |
          VERSION="$(duckdb --version)"
          echo "duckdb --version: $VERSION"
          if ! echo "$VERSION" | grep -q 'v1.1.3'; then
            echo "FAIL: expected v1.1.3"
            exit 1
          fi
          RESULT="$(duckdb -csv -noheader -c "SELECT 'hello';")"
          echo "query result: $RESULT"
          if [ "$RESULT" != "hello" ]; then
            echo "FAIL: expected hello"
            exit 1
          fi
          echo "PASS"
