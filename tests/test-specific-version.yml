name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          version: v1.1.3
      - name: Assert duckdb is installed and executable
        run: |
          echo "Checking duckdb is on PATH..."
          if ! command -v duckdb >/dev/null 2>&1; then
            echo "FAIL: duckdb not found on PATH"
            exit 1
          fi
          echo "duckdb found at: $(command -v duckdb)"
          echo "PASS"
      - name: Assert duckdb version matches requested version
        run: |
          echo "Checking installed duckdb version..."
          VERSION_OUTPUT=$(duckdb --version 2>&1)
          echo "Version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -q "1.1.3"; then
            echo "PASS: duckdb version 1.1.3 is installed"
          else
            echo "FAIL: expected version 1.1.3 but got: $VERSION_OUTPUT"
            exit 1
          fi
      - name: Assert duckdb can execute a simple query
        run: |
          echo "Running a simple SQL query..."
          RESULT=$(duckdb -c "SELECT 'hello' AS greeting;" 2>&1)
          echo "Result: $RESULT"
          if echo "$RESULT" | grep -q "hello"; then
            echo "PASS: duckdb executed query successfully"
          else
            echo "FAIL: expected 'hello' in output, got: $RESULT"
            exit 1
          fi
