name: Test install specific DuckDB version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: v1.1.3
      - name: Assert requested version installed
        run: |
          VERSION="$(duckdb --version)"
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -q 'v1.1.3'; then
            echo "FAIL: expected v1.1.3"
            exit 1
          fi
          if [ -e duckdb_cli-linux-amd64.zip ]; then
            echo "FAIL: archive was not cleaned up"
            exit 1
          fi
          RESULT="$(duckdb -noheader -csv -c "SELECT 'hello';")"
          echo "query result: $RESULT"
          if [ "$(echo "$RESULT" | tr -d '[:space:]')" != "hello" ]; then
            echo "FAIL: expected hello"
            exit 1
          fi
          echo "PASS"
