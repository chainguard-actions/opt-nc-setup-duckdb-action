name: Test install specific DuckDB version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Ensure prerequisites (curl, unzip, sudo)
        run: |
          missing=""
          for t in curl unzip sudo; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          if [ -n "$missing" ]; then
            SUDO=""; [ "$(id -u)" != "0" ] && SUDO="sudo"
            $SUDO apt-get update -y && $SUDO apt-get install -y $missing
          fi
      - id: action
        uses: .
        with:
          version: v1.1.3
      - name: Assert requested version is installed
        run: |
          VERSION="$(duckdb --version)"
          echo "duckdb --version: $VERSION"
          if ! echo "$VERSION" | grep -q 'v1.1.3'; then
            echo "FAIL: expected v1.1.3"
            exit 1
          fi
          if [ ! -x /opt/duckdb/duckdb ]; then
            echo "FAIL: /opt/duckdb/duckdb missing or not executable"
            exit 1
          fi
          echo "PASS"
